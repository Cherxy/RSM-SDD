# Main paper setting: frozen stable teacher targets + student-side SPR + GAC auxiliary relation constraint.
# GSMF is intentionally disabled; keep it only for the separate GSMF ablation.
DATASET:
  NAME: cub200
  NUM_CLASSES: 200
  IMG_SIZE: 224
  ROOT: D:/LCX/PAMA-SDD/data/CUB_200_2011
MODEL:
  TEACHER: resnet32x4
  STUDENT: mobilenetv2
  TEACHER_CKPT: D:/LCX/PAMA-SDD/save/cub200/resnet32x4/ckpt.pth
DISTILLER:
  TYPE: PAMA_DKD
  CE_WEIGHT: 1.0
  KD_WEIGHT: 1.0
  SDD_WEIGHT: 1.0
  GAC_WEIGHT: 1.0
  LGC_WEIGHT: 0.5
  ALPHA: 1.0
  BETA: 8.0
  T: 4.0
  WARMUP: 30
PAMA:
  M: [1, 2, 4]
  NUM_AGENTS: 16
  NUM_HEADS: 4
  EMBED_DIM: 256
  MAX_SPATIAL_SIZE: 28
  USE_APF: true
  USE_AMA: true
  USE_GAC: true
  USE_LGC: true
  USE_RELIABILITY: true
  PYRAMID_LOCAL: true
  TEACHER_TARGET_MODE: stable
  APF_GSMF: false
  CSAM_AGENT_INIT: routing
SOLVER:
  EPOCHS: 240
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  USE_AMP: true
  LR: 0.01
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  LR_DECAY_STAGES: [150, 180, 210]
  LR_DECAY_RATE: 0.1
  SEED: 42
