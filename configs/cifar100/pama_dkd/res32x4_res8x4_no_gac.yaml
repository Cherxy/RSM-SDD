DATASET:
  NAME: cifar100
  NUM_CLASSES: 100
  IMG_SIZE: 32
  ROOT: ./data/cifar100
MODEL:
  TEACHER: resnet32x4
  STUDENT: resnet8x4
  TEACHER_CKPT: D:/LCX/PAMA-SDD/save/models/resnet32x4_vanilla/ckpt_epoch_240.pth
DISTILLER:
  TYPE: PAMA_DKD
  CE_WEIGHT: 1.0
  KD_WEIGHT: 1.0
  SDD_WEIGHT: 1.0
  GAC_WEIGHT: 0.0
  LGC_WEIGHT: 0.5
  ALPHA: 1.0
  BETA: 8.0
  T: 4.0
  WARMUP: 30
  LABEL_SMOOTHING: 0.0
PAMA:
  M: [1, 2, 4]
  NUM_AGENTS: 16
  NUM_HEADS: 4
  USE_APF: true
  USE_AMA: true
  USE_GAC: false
  USE_LGC: true
  USE_RELIABILITY: true
  PYRAMID_LOCAL: true
  TEACHER_TARGET_MODE: stable
  RELIABILITY_FLOOR: 0.2
  RELIABILITY_POWER: 1.0
  APF_INIT_GAMMA: 0.5
  AMA_LAYER_SCALE: 0.0001
SOLVER:
  EPOCHS: 240
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  LR: 0.05
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  LR_DECAY_STAGES: [150, 180, 210]
  LR_DECAY_RATE: 0.1
  USE_AMP: true
  GRAD_CLIP_NORM: 5.0
  SEED: 42

