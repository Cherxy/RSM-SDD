<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="PAMA-SDD code framework schematic">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#596579"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b74c8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db7f2f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d9a72"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b61c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d84d57"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#16324a" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="student-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f3ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="teacher-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1df"/>
      <stop offset="100%" stop-color="#fffaf4"/>
    </linearGradient>
    <style>
      .bg { fill: #fbfdff; }
      .zone { fill: #ffffff; stroke: #d8e1ec; stroke-width: 1.6; filter: url(#soft-shadow); }
      .zone-soft { fill: #f6f9fd; stroke: #d8e1ec; stroke-width: 1.4; }
      .student-zone { fill: url(#student-grad); stroke: #b9d7f4; stroke-width: 1.8; filter: url(#soft-shadow); }
      .teacher-zone { fill: url(#teacher-grad); stroke: #f1c79a; stroke-width: 1.8; filter: url(#soft-shadow); }
      .box { fill: #ffffff; stroke: #c8d4e3; stroke-width: 1.5; filter: url(#soft-shadow); }
      .box-blue { fill: #eff7ff; stroke: #8cbfec; stroke-width: 1.7; }
      .box-green { fill: #ebf8f2; stroke: #86cdae; stroke-width: 1.7; }
      .box-cyan { fill: #eaf8fb; stroke: #7dc7d8; stroke-width: 1.7; }
      .box-orange { fill: #fff3e6; stroke: #f0b36f; stroke-width: 1.7; }
      .box-purple { fill: #f4efff; stroke: #b7a2e9; stroke-width: 1.7; }
      .box-red { fill: #fff0f2; stroke: #e8929a; stroke-width: 1.7; }
      .pill { fill: #ffffff; stroke-width: 1.4; }
      .label { font-family: "Arial", "Helvetica", sans-serif; font-size: 20px; fill: #243247; font-weight: 700; text-anchor: middle; }
      .small { font-family: "Arial", "Helvetica", sans-serif; font-size: 15px; fill: #4f5d73; text-anchor: middle; }
      .tiny { font-family: "Arial", "Helvetica", sans-serif; font-size: 13px; fill: #596579; text-anchor: middle; }
      .zone-label { font-family: "Arial", "Helvetica", sans-serif; font-size: 16px; fill: #67758a; font-weight: 700; letter-spacing: 0.6px; text-anchor: start; }
      .arrow-gray { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow-gray); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-blue { fill: none; stroke: #2b74c8; stroke-width: 2.7; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-orange { fill: none; stroke: #db7f2f; stroke-width: 2.7; marker-end: url(#arrow-orange); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { fill: none; stroke: #2d9a72; stroke-width: 2.7; marker-end: url(#arrow-green); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-purple { fill: none; stroke: #7b61c7; stroke-width: 2.7; marker-end: url(#arrow-purple); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-red { fill: none; stroke: #d84d57; stroke-width: 3; marker-end: url(#arrow-red); stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 7 7; }
      .icon-stroke { fill: none; stroke: #596579; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill-blue { fill: #6eb3ef; }
      .icon-fill-orange { fill: #f2a65a; }
      .icon-fill-green { fill: #73c69a; }
      .icon-fill-purple { fill: #a58add; }
      .icon-fill-cyan { fill: #70c7d6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

