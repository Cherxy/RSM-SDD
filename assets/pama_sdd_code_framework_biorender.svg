  <rect class="box-orange" x="438" y="590" width="165" height="108" rx="18"/>
  <circle cx="520" cy="623" r="18" fill="#fff3e6" stroke="#e6a45f" stroke-width="2"/>
  <path class="icon-stroke" d="M506 623 h28 M520 609 v28"/>
  <text class="label" x="520" y="661">Teacher</text>
  <text class="small" x="520" y="684">Features</text>

  <rect class="box-orange" x="676" y="590" width="205" height="108" rx="18"/>
  <path d="M730 621 c20 -16 47 -16 67 0 c-8 22 -58 22 -67 0 z" fill="#ffe0b9" stroke="#e5a15c" stroke-width="2"/>
  <circle cx="764" cy="624" r="8" fill="#f2a65a"/>
  <text class="label" x="779" y="659">Stable Teacher</text>
  <text class="small" x="779" y="682">Targets</text>

  <path class="arrow-orange" d="M603 644 H676"/>

  <rect class="pill" x="940" y="536" width="186" height="50" rx="25" stroke="#7b61c7"/>
  <text class="small" x="1033" y="567">Global Logits</text>
  <rect class="pill" x="940" y="620" width="186" height="50" rx="25" stroke="#2d9a72"/>
  <text class="small" x="1033" y="651">Local Logits</text>
  <rect class="pill" x="940" y="704" width="186" height="50" rx="25" stroke="#3caec0"/>
  <text class="small" x="1033" y="735">Pooled Agent Tokens</text>

  <path class="arrow-orange" d="M881 644 C906 644 914 561 940 561"/>
  <path class="arrow-orange" d="M881 644 H940"/>
  <path class="arrow-orange" d="M881 644 C906 644 914 729 940 729"/>

  <!-- Orchestration arrows from train.py / input batch -->
  <path class="arrow-gray" d="M290 739 C340 739 360 229 438 229"/>
  <path class="arrow-gray" d="M290 739 C340 739 360 644 438 644"/>
  <path class="arrow-blue" d="M306 618 C372 618 372 252 438 252"/>
  <path class="arrow-orange" d="M306 618 C372 618 372 620 438 620"/>

  <!-- Loss assembly panel -->
  <rect class="zone" x="1256" y="128" width="292" height="626" rx="26"/>
  <text class="zone-label" x="1288" y="168">LOSS AND OUTPUTS</text>

  <rect class="box-red" x="1324" y="324" width="152" height="82" rx="22"/>
  <text class="label" x="1400" y="357">Total</text>
  <text class="label" x="1400" y="382">Loss</text>

  <rect class="pill" x="1288" y="214" width="132" height="44" rx="22" stroke="#8897aa"/>
  <text class="small" x="1354" y="242">CE Loss</text>
  <rect class="pill" x="1430" y="214" width="90" height="44" rx="22" stroke="#8897aa"/>
  <text class="small" x="1475" y="242">Logits</text>
  <path class="arrow-gray" d="M1370 258 C1378 284 1388 300 1394 324"/>

  <rect class="pill" x="1288" y="276" width="232" height="44" rx="22" stroke="#7b61c7"/>
  <text class="small" x="1404" y="304">Global KD / DKD / NKD</text>
  <path class="arrow-purple" d="M1404 320 V324"/>

  <rect class="pill" x="1288" y="430" width="232" height="44" rx="22" stroke="#2d9a72"/>
  <text class="small" x="1404" y="458">Reliability-aware Local SDD</text>
  <path class="arrow-green" d="M1404 430 V406"/>

  <rect class="pill" x="1288" y="492" width="232" height="44" rx="22" stroke="#3caec0"/>
  <text class="small" x="1404" y="520">GAC + LGC</text>
  <path class="arrow-blue" d="M1404 492 C1404 462 1404 436 1404 406"/>

  <rect class="box" x="1290" y="600" width="104" height="72" rx="18"/>
  <path class="icon-stroke" d="M1320 635 l14 14 l28 -33"/>
  <text class="small" x="1342" y="656">Metrics</text>

  <rect class="box" x="1414" y="600" width="104" height="72" rx="18"/>
  <path class="icon-stroke" d="M1445 621 h42 v34 h-42 z M1454 621 v12 h24 v-12"/>
  <text class="small" x="1466" y="656">Checkpoints</text>

  <path class="arrow-gray" d="M1400 406 V574"/>
  <path class="arrow-gray" d="M1400 574 C1380 580 1365 589 1350 600"/>
  <path class="arrow-gray" d="M1400 574 C1422 580 1442 589 1458 600"/>

  <!-- Cross-network distillation links -->
  <path class="arrow-purple" d="M1159 229 C1218 229 1232 561 940 561"/>
  <text class="tiny" x="1198" y="360" fill="#7b61c7">global distillation</text>

  <path class="arrow-green" d="M1159 357 C1216 386 1214 646 1126 646"/>
  <text class="tiny" x="1192" y="492" fill="#2d9a72">local SDD</text>

  <path class="arrow-blue" d="M895 288 C895 438 1052 438 1033 704"/>
  <text class="tiny" x="996" y="438" fill="#2b74c8">agent relation graph</text>

  <path class="arrow-blue dash" d="M990 388 C1120 450 1140 520 1033 536"/>
  <text class="tiny" x="1110" y="470" fill="#2b74c8">local-global coherence</text>

  <!-- Backprop update arrow -->
  <path class="arrow-red" d="M1324 365 C1210 126 710 103 510 170"/>
  <text class="tiny" x="1012" y="112" fill="#d84d57">update student only</text>

  <!-- Small legend -->
  <rect class="zone-soft" x="423" y="808" width="764" height="54" rx="18"/>
  <circle cx="455" cy="835" r="8" fill="#6eb3ef"/>
  <text class="tiny" x="518" y="840">student modules</text>
  <circle cx="638" cy="835" r="8" fill="#f2a65a"/>
  <text class="tiny" x="708" y="840">frozen teacher targets</text>
  <circle cx="860" cy="835" r="8" fill="#73c69a"/>
  <text class="tiny" x="942" y="840">local SDD signals</text>
  <circle cx="1080" cy="835" r="8" fill="#a58add"/>
  <text class="tiny" x="1132" y="840">KD losses</text>
</svg>
