  <rect class="box" x="78" y="158" width="228" height="92" rx="16"/>
  <path class="icon-stroke" d="M112 181 h42 l18 18 v29 h-60 z"/>
  <path class="icon-stroke" d="M154 181 v18 h18"/>
  <path class="icon-stroke" d="M122 208 h38 M122 222 h30"/>
  <text class="label" x="222" y="199">YAML</text>
  <text class="small" x="222" y="222">Configs</text>

  <rect class="box" x="78" y="282" width="228" height="92" rx="16"/>
  <rect x="112" y="309" width="54" height="38" rx="7" fill="#e8f3ff" stroke="#7fb6e8" stroke-width="2"/>
  <circle cx="128" cy="328" r="7" class="icon-fill-blue"/>
  <path class="icon-stroke" d="M142 342 l11 -12 l12 12"/>
  <text class="label" x="226" y="322">Dataset</text>
  <text class="small" x="226" y="345">Loaders</text>

  <rect class="box" x="78" y="406" width="228" height="92" rx="16"/>
