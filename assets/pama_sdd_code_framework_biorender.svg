  <text class="small" x="895" y="276">Agents</text>

  <rect class="box-blue" x="1014" y="170" width="145" height="118" rx="18"/>
  <path d="M1057 204 h58 v48 h-58 z" fill="#ffffff" stroke="#6caee6" stroke-width="2"/>
  <path d="M1063 215 h46 M1063 228 h46 M1063 241 h46" stroke="#9bc9ef" stroke-width="5" stroke-linecap="round"/>
  <text class="label" x="1087" y="260">Enhanced</text>
  <text class="small" x="1087" y="281">Features</text>

  <rect class="box-green" x="822" y="326" width="337" height="62" rx="18"/>
  <g transform="translate(850 342)">
    <rect x="0" y="0" width="40" height="32" rx="5" fill="#ffffff" stroke="#72bd97" stroke-width="2"/>
    <path d="M13 0 v32 M27 0 v32 M0 11 h40 M0 22 h40" stroke="#9ad5b6" stroke-width="1.6"/>
  </g>
  <text class="label" x="1002" y="366">SDD Local Logits</text>

  <path class="arrow-blue" d="M583 229 H630"/>
  <path class="arrow-green" d="M775 229 H822"/>
  <path class="arrow-blue" d="M967 229 H1014"/>
  <path class="arrow-green" d="M1087 288 V326"/>

