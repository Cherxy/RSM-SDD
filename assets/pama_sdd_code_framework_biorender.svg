  <text class="label" x="226" y="445">Teacher</text>
  <text class="small" x="226" y="468">Checkpoint</text>

  <rect class="box-blue" x="78" y="560" width="228" height="116" rx="18"/>
  <rect x="108" y="594" width="44" height="36" rx="6" fill="#ffffff" stroke="#6caee6" stroke-width="2"/>
  <rect x="118" y="604" width="44" height="36" rx="6" fill="#dff0ff" stroke="#6caee6" stroke-width="2"/>
  <rect x="128" y="614" width="44" height="36" rx="6" fill="#bfe0fb" stroke="#6caee6" stroke-width="2"/>
  <text class="label" x="228" y="609">Input Image</text>
  <text class="small" x="228" y="634">Batch</text>

  <rect class="box-purple" x="94" y="708" width="196" height="62" rx="18"/>
  <text class="label" x="192" y="746">train.py</text>

  <path class="arrow-gray" d="M192 250 V282"/>
  <path class="arrow-gray" d="M192 374 V406"/>
  <path class="arrow-gray" d="M192 498 V560"/>
  <path class="arrow-gray" d="M192 676 V708"/>

  <!-- Main model zones -->
  <rect class="student-zone" x="405" y="82" width="800" height="330" rx="28"/>
  <text class="zone-label" x="435" y="122">STUDENT PATH</text>

  <rect class="teacher-zone" x="405" y="488" width="800" height="300" rx="28"/>
  <text class="zone-label" x="435" y="528">FROZEN TEACHER PATH</text>
  <path class="icon-stroke" d="M1136 520 v-12 a13 13 0 0 1 26 0 v12"/>
  <rect x="1128" y="518" width="42" height="28" rx="7" fill="#fffaf4" stroke="#d89348" stroke-width="2"/>
  <text class="tiny" x="1149" y="565">no gradient</text>

  <!-- Student modules -->
  <rect class="box-blue" x="438" y="170" width="145" height="118" rx="18"/>
  <circle cx="510" cy="204" r="19" fill="#dff0ff" stroke="#6caee6" stroke-width="2"/>
  <path class="icon-stroke" d="M495 204 h30 M510 189 v30"/>
  <text class="label" x="510" y="244">Backbone</text>
  <text class="small" x="510" y="267">Features</text>

  <rect class="box-green" x="630" y="170" width="145" height="118" rx="18"/>
  <path d="M672 250 h60 v-54 h-60 z" fill="#ffffff" stroke="#72bd97" stroke-width="2"/>
  <path d="M681 238 h42 M681 224 h32 M681 210 h22" stroke="#5bb184" stroke-width="6" stroke-linecap="round"/>
  <text class="label" x="702" y="206">APF</text>
  <text class="small" x="702" y="267">Pyramid</text>

  <rect class="box-cyan" x="822" y="170" width="145" height="118" rx="18"/>
  <circle cx="878" cy="216" r="8" class="icon-fill-cyan"/>
  <circle cx="904" cy="202" r="8" class="icon-fill-cyan"/>
  <circle cx="904" cy="230" r="8" class="icon-fill-cyan"/>
  <circle cx="930" cy="216" r="8" class="icon-fill-cyan"/>
  <path class="icon-stroke" d="M886 216 h36 M900 207 l-16 9 l16 9 M912 207 l16 9 l-16 9"/>
