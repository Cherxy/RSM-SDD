<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="Detailed PAMA-SDD mechanism schematic with GSMF SPR SDD decoupling and GAC relation graph">
