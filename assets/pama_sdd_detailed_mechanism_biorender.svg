      .mono { font-family:"Arial", Helvetica, sans-serif; font-size:13px; fill:#38485c; text-anchor:middle; font-weight:700; }
      .arrow-gray { fill:none; stroke:#5f6f84; stroke-width:2.2; marker-end:url(#arrow-gray); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-blue { fill:none; stroke:#2d77c8; stroke-width:2.6; marker-end:url(#arrow-blue); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-green { fill:none; stroke:#278c66; stroke-width:2.6; marker-end:url(#arrow-green); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-cyan { fill:none; stroke:#2aa4b7; stroke-width:2.6; marker-end:url(#arrow-cyan); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-orange { fill:none; stroke:#d88231; stroke-width:2.6; marker-end:url(#arrow-orange); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-purple { fill:none; stroke:#7a5cc5; stroke-width:2.6; marker-end:url(#arrow-purple); stroke-linecap:round; stroke-linejoin:round; }
      .arrow-red { fill:none; stroke:#d84b55; stroke-width:3; marker-end:url(#arrow-red); stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke-dasharray:7 7; }
      .icon { fill:none; stroke:#5f6f84; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .node-blue { fill:#75b8ef; }
      .node-cyan { fill:#65c3d2; }
      .node-green { fill:#72c89c; }
      .node-orange { fill:#efa85d; }
      .node-purple { fill:#a58bdf; }
